# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: MailClient - CI Build

on:
  
  push:
    paths:
      - 'MailClient/**'
      - '.github/workflows/mailclient_ci.yml'

  workflow_call:
    secrets:
      NUGET_TOKEN:
        description: 'Nuget pwd'
        required: true
      NUGET_USERNAME:
        description: 'Nuget username'
        required: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # Build client
    - name: Update GitHub nuget repository
      run: dotnet nuget update source "DarkFactorAS" --store-password-in-clear-text --configfile "MailClient/NuGet.config" --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_TOKEN }}
    - name: MailClient - Restore dependencies
      run: dotnet restore MailClient/MailClient.csproj
    - name: MailClient - Build
      run: dotnet build --no-restore MailClient/MailClient.csproj

#    - name: Test
#      run: dotnet test --no-build --verbosity normal
