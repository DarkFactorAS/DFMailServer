# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: MailClient - Deploy NuGet package

on:

  workflow_dispatch:

  push:
    paths:
      - '.github/workflows/mailclient_deploy.yml'

defaults:
  run:
    working-directory: ./MailClient

env:
  PROJECT: MailClient.csproj
  CONFIGURATION: Release

jobs:

  # Deploy step
  deploy:

    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # Build client
    - name: Update GitHub nuget repository
      run: dotnet nuget update source "DarkFactorAS" --store-password-in-clear-text --configfile "NuGet.config" --username ${{ secrets.NUGET_USERNAME }} --password ${{ secrets.NUGET_TOKEN }}

    - name: MailClient - Restore dependencies
      run: dotnet restore ${{ env.PROJECT }}

    - name: MailClient - Build
      run: dotnet build --no-restore ${{ env.PROJECT }} --configuration ${{ env.CONFIGURATION }}

    - name: Pack Nuget
      run: dotnet pack ${{ env.PROJECT }} --configuration ${{ env.CONFIGURATION }}

    - name: MailClient - Deploy package
      run: 
        dotnet nuget push "bin/${{ env.CONFIGURATION }}/*.nupkg"  --api-key ${{ secrets.NUGET_TOKEN }} --source "DarkFactorAS" --skip-duplicate
  